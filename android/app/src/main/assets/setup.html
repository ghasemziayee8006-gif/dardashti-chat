<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>عنوان الخادم — دردشتي</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:-apple-system,'Segoe UI',Tahoma,sans-serif;
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(160deg,#0b1420,#152538 55%,#0d1b2a);color:#e9eff5;
    padding:24px;text-align:center;
  }
  .card{max-width:400px;width:100%}
  .icon{width:90px;height:90px;margin:0 auto 18px;border-radius:24px;
    background:linear-gradient(135deg,#38b6d8,#2a6bc9);display:flex;align-items:center;justify-content:center;font-size:44px}
  h1{font-size:20px;margin-bottom:8px}
  p{color:#9db0c2;font-size:13.5px;line-height:1.9;margin-bottom:22px}
  input{
    width:100%;padding:14px;border-radius:12px;border:1.5px solid #2b3b4c;
    background:#16222f;color:#e9eff5;font-size:14px;direction:ltr;text-align:left;
    font-family:monospace;margin-bottom:14px;outline:none;
  }
  input:focus{border-color:#64b5ef}
  button{
    width:100%;padding:14px;border:none;border-radius:14px;font-size:16px;font-weight:700;
    background:linear-gradient(135deg,#38b6d8,#2a6bc9);color:#fff;cursor:pointer;font-family:inherit;
  }
  button:active{transform:scale(.98)}
  .hint{font-size:11.5px;color:#5f7181;margin-top:14px}
</style>
</head>
<body>
  <div class="card">
    <div class="icon">💬</div>
    <h1>عنوان الخادم</h1>
    <p>عادةً لا تحتاج لتغيير هذا العنوان — استخدمه فقط إذا أرسل لك مالك التطبيق عنوان خادم جديد.</p>
    <input id="url" type="url" placeholder="https://…" spellcheck="false">
    <button onclick="save()">💾 حفظ والاتصال</button>
    <p class="hint">سيُحفظ العنوان على جهازك ويُستخدم في كل مرة.</p>
  </div>
  <script>
    document.getElementById('url').value = Android.currentUrl();
    function save(){
      var v = document.getElementById('url').value.trim();
      if (v) Android.saveServerUrl(v);
    }
  </script>
</body>
</html>
