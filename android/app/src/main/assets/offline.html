<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>لا يوجد اتصال — دردشتي</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:-apple-system,'Segoe UI',Tahoma,sans-serif;
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(160deg,#0b1420,#152538 55%,#0d1b2a);color:#e9eff5;
    padding:24px;text-align:center;
  }
  .card{max-width:360px;width:100%}
  .icon{
    width:110px;height:110px;margin:0 auto 22px;border-radius:50%;
    background:rgba(255,255,255,.06);display:flex;align-items:center;justify-content:center;
    font-size:52px;border:2px solid rgba(100,181,239,.25);
  }
  h1{font-size:22px;margin-bottom:10px}
  p{color:#9db0c2;font-size:14.5px;line-height:1.9;margin-bottom:26px}
  button{
    width:100%;padding:14px;border:none;border-radius:14px;font-size:16px;font-weight:700;
    margin-bottom:12px;cursor:pointer;font-family:inherit;
  }
  .retry{background:linear-gradient(135deg,#38b6d8,#2a6bc9);color:#fff}
  .setup{background:rgba(255,255,255,.08);color:#c7d5e2}
  button:active{transform:scale(.98)}
</style>
</head>
<body>
  <div class="card">
    <div class="icon">📡</div>
    <h1>لا يوجد اتصال بالإنترنت</h1>
    <p>تطبيق «دردشتي» يحتاج اتصالاً بالإنترنت للدردشة والمكالمات.<br>تأكد من اتصالك ثم أعد المحاولة.</p>
    <button class="retry" onclick="Android.retry()">🔄 إعادة المحاولة</button>
    <button class="setup" onclick="location.href='setup.html'">⚙️ تغيير عنوان الخادم</button>
  </div>
</body>
</html>
